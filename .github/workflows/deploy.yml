name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # このワークフローはビルドを行わず、コミットされた packages/router/public/ を
      # そのまま本番へ配信する。壊れた成果物がコミットされていれば本番が壊れるため、
      # デプロイ前に vite base とビルド成果物の参照パスを検査して止める。
      # 詳細: .docs/ASSET_PATH_INCIDENT.md
      - name: Check asset paths
        run: node scripts/check-asset-paths.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'packages/router'
